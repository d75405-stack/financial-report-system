name: Peek public data
# 手動執行：看 LINE 小幫手公開查詢的結果（只有政府開放資料等公開資料，例如垃圾車班表），給維護的 Claude 對照用
on:
  workflow_dispatch:
    inputs:
      action:
        description: 公開查詢
        type: choice
        options: [garbage, garbageText, garbageWeb, siteGarbage, siteInfo, osmRoads, siteRepairs, cecPages, rawFetch, buziVotes, cecDb]
        default: garbage
      q:
        description: 關鍵字（選填）
        required: false
        default: ''
jobs:
  peek:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_ID: AKfycbyLrB-sGBnyeOktxkbATRpmJEO2NlR2auGaol8nK7gMU1MZSwczN-IbqD3fWq2HmVNjwg
    steps:
      - name: Fetch
        env:
          ACTION: ${{ inputs.action }}
          Q: ${{ inputs.q }}
        run: |
          if [ "$ACTION" = "osmRoads" ]; then
            # OpenStreetMap 公開地圖：太原路沿線的路口（哪些在廍子里）、廍子里裡面的路名（排路口拜票、掃街路線用）
            python3 - <<'PY'
          import json, urllib.request, urllib.parse
          import time
          EPS = ['https://overpass-api.de/api/interpreter', 'https://overpass.kumi.systems/api/interpreter', 'https://overpass.private.coffee/api/interpreter', 'https://maps.mail.ru/osm/tools/overpass/api/interpreter']
          def ov(q):
              d = urllib.parse.urlencode({'data': q}).encode()
              last = None
              for k in range(8):
                  ep = EPS[k % len(EPS)]
                  try:
                      req = urllib.request.Request(ep, data=d, headers={'User-Agent': 'buzi-peek/1.0'})
                      return json.load(urllib.request.urlopen(req, timeout=180))
                  except Exception as e:
                      last = e; print('（重試）', ep, e); time.sleep(5)
              raise last
          rel = ov('[out:json][timeout:90];rel["boundary"="administrative"]["name"="廍子里"];out geom;')
          polys = []
          for r in rel.get('elements', []):
              print('里界：', r.get('tags', {}).get('name'), r.get('tags', {}).get('admin_level'), len(r.get('members', [])), '段')
              for m in r.get('members', []):
                  if m.get('type') == 'way' and m.get('role') in ('outer', '') and m.get('geometry'):
                      polys.append([(g['lat'], g['lon']) for g in m['geometry']])
          # 外框的線段串成一圈（簡化：把所有外框點連起來做射線法，邊界附近可能不準）
          segs = [(a, b) for pl in polys for a, b in zip(pl, pl[1:])]
          def inside(lat, lon):
              if not segs: return None
              c = False
              for (y1, x1), (y2, x2) in segs:
                  if (y1 > lat) != (y2 > lat) and lon < (x2 - x1) * (lat - y1) / (y2 - y1) + x1: c = not c
              return c
          q = '[out:json][timeout:120];area["name"="北屯區"]["boundary"="administrative"]->.bt;way(area.bt)["highway"]["name"~"^太原路"]->.ty;node(w.ty)->.tn;way(bn.tn)["highway"]->.x;(.ty;.x;);out body;>;out skel qt;'
          d = ov(q)
          nodes = {e['id']: (e['lat'], e['lon']) for e in d['elements'] if e['type'] == 'node'}
          ways = [e for e in d['elements'] if e['type'] == 'way']
          by = {}
          for w in ways:
              for n in w.get('nodes', []): by.setdefault(n, set()).add((w.get('tags', {}).get('name') or w.get('tags', {}).get('highway', ''), w.get('tags', {}).get('highway', '')))
          seen = {}
          for w in ways:
              nm = w.get('tags', {}).get('name', '')
              if not nm.startswith('太原路'): continue
              for n in w.get('nodes', []):
                  others = sorted(x[0] for x in by.get(n, ()) if not x[0].startswith('太原路') and x[1] not in ('service', 'footway', 'path', 'cycleway', 'steps', 'track'))
                  if not others or n not in nodes: continue
                  k = (nm, tuple(others))
                  if k in seen: continue
                  lat, lon = nodes[n]
                  seen[k] = (lat, lon, inside(lat, lon))
          print('════ 太原路的路口（北屯區）：', len(seen))
          for (nm, others), (lat, lon, ins) in sorted(seen.items(), key=lambda kv: (kv[1][1], kv[1][0])):
              print(f'{nm} × {"、".join(others)}｜{lat:.5f},{lon:.5f}｜{"廍子里" if ins else ("不在" if ins is False else "?")}')
          if polys:
              lats = [p[0] for pl in polys for p in pl]; lons = [p[1] for pl in polys for p in pl]
              bb = f'{min(lats)},{min(lons)},{max(lats)},{max(lons)}'
              r2 = ov(f'[out:json][timeout:120];way["highway"]["name"]({bb});out tags center;')
              names = {}
              for w in r2['elements']:
                  c = w.get('center') or {}
                  if c and inside(c['lat'], c['lon']): names[w['tags']['name']] = names.get(w['tags']['name'], 0) + 1
              print('════ 廍子里裡面的路名：', len(names))
              print('、'.join(sorted(names)))
          PY
            exit 0
          fi
          if [ "$ACTION" = "siteRepairs" ]; then
            # 網站「快速報修進度」公開的資料（類別、地點、處理單位、進度，沒有報修人資料）；q 寫單位名稱只列那個單位的
            curl -sSL --max-time 90 "https://ccs2024taiwan.pages.dev/api/repairs" -o rp.json -w "API HTTP %{http_code}\n"
            python3 - <<'PY'
          import json, os
          d = json.load(open('rp.json')); q = os.environ.get('Q', '')
          L = [r for r in d.get('list', []) if not q or q in (r.get('rep') or '')]
          print('open', d.get('open'), '｜全部', len(d.get('list', [])), '件｜符合', len(L), '件')
          for r in L:
              last = (r.get('log') or [])[-1:] 
              print('・', r['id'], r['status'], '｜', r.get('rep'), '｜', r.get('category'), '｜', r.get('location'), '｜報修', r.get('createdAt'), '｜分派', r.get('assignedAt'), '｜完成', r.get('doneAt') or '-', '｜照片', r.get('photos'), '/', r.get('donePhotos'))
              for x in (r.get('log') or []): print('    ', x.get('at'), x.get('by'), '：', (x.get('text') or '')[:120], '（完成）' if x.get('done') else '')
          PY
            exit 0
          fi
          if [ "$ACTION" = "cecPages" ]; then
            # 選舉資訊頁核對用：讀中選會、臺中市選委會和新聞的公開頁面，只印出跟票、通知單、顏色、年齡有關的句子
            # 網址固定在這裡；q 可以多給一個網址，但只接受下面這些網域
            pip install -q pypdf >/dev/null 2>&1 || true
            python3 - <<'PY'
          import os, re, io, urllib.request, urllib.parse, html
          URLS = [
            'https://web.cec.gov.tw/api/file/3ea9497f-7945-49a2-bd4b-375e3d6f1ddf.pdf',
            'https://info.cec.gov.tw/vote2026/static/file/ebook/index.html',
            'https://www.cna.com.tw/news/aipl/202611105002.aspx',
            'https://n.yam.com/Article/20261118959736',
            'https://www.ksnews.com.tw/e/160880',
            'https://www.knews.com.tw/news/5EAE50FD12B78572A1CA112C0B6AD3F6',
            'https://www.genews.tw/10396/',
            'https://www.cw.com.tw/article/5143668',
            'https://tfc-taiwan.org.tw/election2026/reports/taiwan-2026-election-voting-notice-ballots-guide',
            'https://news.ltn.com.tw/news/politics/breakingnews/5644999',
          ]
          OK = ('cec.gov.tw', 'taichung.gov.tw', 'cna.com.tw', 'yam.com', 'ksnews.com.tw', 'knews.com.tw', 'genews.tw', 'cw.com.tw', 'moi.gov.tw', 'ris.gov.tw', 'ltn.com.tw', 'tfc-taiwan.org.tw', 'ccs2024taiwan.pages.dev')
          q = os.environ.get('Q', '').strip()
          if q.startswith('https://') and urllib.parse.urlparse(q).hostname and urllib.parse.urlparse(q).hostname.endswith(OK): URLS.insert(0, q)
          KW = re.compile(r'通知單|顏色|白色|紅色|粉紅|黃色|淺|18歲|18 歲|20歲|20 歲|領票|張|公投票')
          for u in URLS:
              print('\n=====', u)
              try:
                  req = urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (buzi-peek)'})
                  raw = urllib.request.urlopen(req, timeout=60).read()
              except Exception as e:
                  print('讀不到：', e); continue
              if raw[:4] == b'%PDF':
                  try:
                      from pypdf import PdfReader
                      t = '\n'.join((pg.extract_text() or '') for pg in PdfReader(io.BytesIO(raw)).pages)
                  except Exception as e:
                      print('PDF 讀不到：', e); continue
              else:
                  t = raw.decode('utf-8', 'ignore')
                  t = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', t)
                  t = html.unescape(re.sub(r'<[^>]+>', '\n', t))
              lines = [re.sub(r'\s+', ' ', x).strip() for x in re.split(r'[\n。]', t)]
              hits = [x for x in lines if x and KW.search(x) and len(x) < 400]
              print('字數', len(t), '｜符合', len(hits), '句')
              for x in hits[:60]: print('・', x)
          PY
            exit 0
          fi
          if [ "$ACTION" = "rawFetch" ]; then
            # 找中選會開放資料用：q 放一個或多個網址（空白隔開，只接受中選會、政府資料開放平臺），印出開頭的內容；zip 列出裡面的檔案
            python3 - <<'PY'
          import os, io, json, zipfile, urllib.request, urllib.parse
          OK = ('cec.gov.tw', 'data.gov.tw')
          import re
          toks = os.environ.get('Q', '').split()
          G = [re.compile(t[5:]) for t in toks if t.startswith('grep=')]
          for u in [t for t in toks if not t.startswith('grep=')]:
              h = urllib.parse.urlparse(u).hostname or ''
              print('\n=====', u)
              if not u.startswith('https://') or not h.endswith(OK): print('不接受這個網域'); continue
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (buzi-peek)'}), timeout=180)
                  raw = r.read(); print('HTTP', r.status, r.headers.get('Content-Type'), len(raw), 'bytes')
              except Exception as e:
                  print('讀不到：', e); continue
              if raw[:2] == b'PK':
                  z = zipfile.ZipFile(io.BytesIO(raw))
                  for i in z.infolist()[:400]: print(' ', i.filename, i.file_size)
                  continue
              t = raw.decode('utf-8', 'ignore')
              if G:
                  # grep=規則：只印出符合的地方前後一段（找網站程式裡的資料網址用）
                  seen = set()
                  for g in G:
                      for m in g.finditer(t):
                          k = t[max(0, m.start() - 150): m.end() + 150]
                          if k in seen: continue
                          seen.add(k); print('…', k.replace('\\n', ' '), '…')
                          if len(seen) > 60: break
              else:
                  print(t[:8000])
          PY
            exit 0
          fi
          if [ "$ACTION" = "buziVotes" ]; then
            # 中選會選舉資料庫（公開資料）：歷屆北屯區廍子里里長選舉，各投開票所的得票、投票率。q 可以換里名（預設廍子里）
            curl -sSL --max-time 600 -o vd.zip "https://data.cec.gov.tw/%E9%81%B8%E8%88%89%E8%B3%87%E6%96%99%E5%BA%AB/votedata.zip" -w "votedata.zip HTTP %{http_code} %{size_download} bytes\n"
            python3 - <<'PY'
          import os, io, csv, zipfile, collections
          LI = os.environ.get('Q', '').strip() or '廍子里'
          z = zipfile.ZipFile('vd.zip')
          names = z.namelist()
          dirs = sorted({n.rsplit('/', 1)[0] for n in names if n.endswith('elctks.csv') and ('村里長' in n or '里長' in n)})
          print('村里長的資料夾：'); [print('  ', d) for d in dirs]
          def rows(path):
              raw = z.read(path)
              for enc in ('utf-8-sig', 'big5', 'cp950'):
                  try: t = raw.decode(enc); break
                  except Exception: continue
              return [[c.strip().lstrip("'") for c in r] for r in csv.reader(io.StringIO(t)) if r]
          for d in dirs:
              try:
                  base = rows(d + '/elbase.csv')
              except KeyError:
                  continue
              dist = [r for r in base if len(r) >= 6 and r[5] == '北屯區']
              hit = []
              for dr in dist:
                  hit += [r for r in base if len(r) >= 6 and r[0] == dr[0] and r[1] == dr[1] and r[3] == dr[3] and r[5] == LI and r not in hit]
              if not hit:
                  print('\n（' + d + ' 沒對到）北屯區：', dist[:3], '｜名字有', LI, '的：', [r for r in base if LI in ''.join(r)][:5], '｜elbase 開頭：', base[:3])
                  continue
              print('\n════════', d)
              for v in hit:
                  key = lambda r: r[0] == v[0] and r[1] == v[1] and r[3] == v[3] and r[4] == v[4]
                  cand = [r for r in rows(d + '/elcand.csv') if len(r) > 6 and key(r)]
                  print('里代碼', v[:5], v[5], '｜候選人', len(cand))
                  for c in cand: print('  號次', c[5], c[6], '｜政黨', c[7], '｜性別', c[8], '｜年齡', c[10] if len(c) > 10 else '', '｜現任', c[13] if len(c) > 13 else '', '｜當選', c[14] if len(c) > 14 else '')
                  tk = [r for r in rows(d + '/elctks.csv') if len(r) > 7 and key(r)]
                  st = collections.OrderedDict()
                  for r in tk: st.setdefault(r[5], {})[r[6]] = (r[7], r[8] if len(r) > 8 else '')
                  print('  elctks 欄位樣本：', tk[:2])
                  for s_, m in st.items(): print('  所', s_, '｜', '　'.join(f'{k}號 {a} 票（{b}%）' for k, (a, b) in sorted(m.items())))
                  pf = [r for r in rows(d + '/elprof.csv') if len(r) > 12 and key(r)]
                  print('  elprof（keys 後面：有效、無效、投票數、已領未投、發出、用餘、選舉人數、…）')
                  for r in pf: print('  所', r[5], '｜', r[6:])
          PY
            exit 0
          fi
          if [ "$ACTION" = "cecDb" ]; then
            # 中選會選舉資料庫 db.cec.gov.tw（公開資料）：某屆村里長選舉，臺中市某個里的得票、投票率，再細到各投開票所
            # q：「theme_id 里名」，預設 111 年村里長選舉、廍子里
            python3 - <<'PY'
          import os, json, urllib.request
          a = (os.environ.get('Q', '') or '').split()
          TH = a[0] if a else '0bd11a4b3f092aae2811741428ec3e3d'
          LI = a[1] if len(a) > 1 else '廍子里'
          B = 'https://db.cec.gov.tw/static/elections/data/'
          def get(path):
              u = B + path
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'Mozilla/5.0 (buzi-peek)'}), timeout=120))
              except Exception as e:
                  print('讀不到', u, e); return None
          def dicts(o):
              if isinstance(o, dict):
                  yield o
                  for v in o.values(): yield from dicts(v)
              elif isinstance(o, list):
                  for v in o: yield from dicts(v)
          def show(d): print('  ', json.dumps({k: v for k, v in d.items() if not isinstance(v, (dict, list))}, ensure_ascii=False))
          codes = None
          for kind in ('tickets', 'profiles'):
              j = get(f'{kind}/ELC/V0/00/{TH}/L/66_000_00_000_0000.json')
              if j is None: continue
              ds = list(dicts(j))
              print(f'\n---- {kind} 結構：', type(j).__name__, list(j.keys())[:5] if isinstance(j, dict) else len(j), '｜共', len(ds), '個物件｜樣本：')
              for d in ds[1:3]: show(d)
              # 用名字找；找不到就用 2018 年的代碼（北屯區 080、廍子里 0013）找，順便看名字欄位是怎麼寫的
              hit = [d for d in ds if any(isinstance(v, str) and LI in v for v in d.values())]
              if not hit: hit = [d for d in ds if str(d.get('dept_code')) == '080' and str(d.get('li_code')) == '0013']
              print(f'\n==== {kind} 里層級（臺中市），{LI}：{len(hit)} 筆')
              for d in hit[:20]: show(d)
              if hit and not codes:
                  h = hit[0]; codes = [h.get(k) for k in ('prv_code', 'city_code', 'area_code', 'dept_code', 'li_code')]
              if kind == 'profiles':
                  # 比較用：臺中市各里的無效票比例、投票率（同額競選＝只有 1 位候選人的里）
                  import statistics as S
                  L = [d for d in ds if 'valid_ticket' in d and str(d.get('tbox_no')) == '0000' and str(d.get('li_code')) != '0000' and d.get('vote_ticket')]
                  def st(name, xs):
                      if not xs: return
                      inv = [d['invalid_ticket'] / d['vote_ticket'] * 100 for d in xs]; vt = [d['vote_to_elect'] for d in xs]
                      print(f'  {name}：{len(xs)} 個里｜無效票比例 平均 {S.mean(inv):.1f}%、中位數 {S.median(inv):.1f}%、最高 {max(inv):.1f}%｜投票率 平均 {S.mean(vt):.1f}%')
                  one = [d for d in L if d.get('cand_num') == 1]; many = [d for d in L if (d.get('cand_num') or 0) > 1]
                  print('\n==== 比較')
                  st('臺中市 全部的里', L); st('臺中市 同額競選（1 位候選人）', one); st('臺中市 有競爭（2 位以上）', many)
                  bt = [d for d in L if str(d.get('dept_code')) == '080']
                  st('北屯區 全部的里', bt); st('北屯區 同額競選', [d for d in bt if d.get('cand_num') == 1])
                  if one:
                      r = sorted(one, key=lambda d: -d['invalid_ticket'] / d['vote_ticket'])
                      for i, d in enumerate(r):
                          if str(d.get('dept_code')) == '080' and str(d.get('li_code')) == '0013':
                              print(f'  廍子里在臺中市 {len(one)} 個同額競選的里裡面，無效票比例排第 {i + 1} 高'); break
                  print('  北屯區各里：')
                  for d in sorted(bt, key=lambda d: d['li_code']):
                      print(f"    {d['li_code']} {d.get('area_name')}｜候選人 {d.get('cand_num')}｜選舉人 {d['votable_population']}｜投票率 {d['vote_to_elect']}%｜無效票 {d['invalid_ticket']}（{d['invalid_ticket'] / d['vote_ticket'] * 100:.1f}%）")
          print('\n代碼：', codes)
          if codes and all(codes):
              for kind in ('tickets', 'profiles'):
                  # 投開票所層級的檔名試幾種：這個里、這個區、整個市
                  j = None
                  for fn in ('_'.join(codes), '_'.join(codes[:4] + ['0000']), '_'.join(codes[:2] + ['00', '000', '0000'])):
                      j = get(f'{kind}/ELC/V0/00/{TH}/T/{fn}.json')
                      if j is not None: print('用', fn); break
                  if j is None: continue
                  rows = [d for d in dicts(j) if 'tbox_no' in d and str(d.get('dept_code')) == codes[3] and str(d.get('li_code')) == codes[4]]
                  print(f'\n==== {kind} 投開票所層級：{len(rows)} 筆')
                  for d in rows[:120]: show(d)
          PY
            exit 0
          fi
          if [ "$ACTION" = "siteInfo" ]; then
            # 網站每一頁最上面的公告、特約家數（公開資料）
            curl -sSL --max-time 60 "https://ccs2024taiwan.pages.dev/api/site-info" -w "\nAPI HTTP %{http_code}\n"
            exit 0
          fi
          if [ "$ACTION" = "siteGarbage" ]; then
            # 網站上線後的檢查：/garbage/ 頁面和 /api/garbage（公開資料）
            curl -sSL --max-time 60 "https://ccs2024taiwan.pages.dev/garbage/" -o page.html -w "PAGE HTTP %{http_code} %{size_download} bytes\n"
            grep -o "<title>[^<]*</title>" page.html || true
            curl -sSL --max-time 120 -G "https://ccs2024taiwan.pages.dev/api/garbage" --data-urlencode "q=${Q}" -o out.json -w "API HTTP %{http_code} %{size_download} bytes\n"
            head -c 1500 out.json; echo
            exit 0
          fi
          curl -sSL --max-time 120 -G "https://script.google.com/macros/s/${DEPLOYMENT_ID}/exec" --data-urlencode "action=${ACTION}" --data-urlencode "q=${Q}" -o out.json -w "HTTP %{http_code} %{size_download} bytes\n"
          head -c 120000 out.json; echo
